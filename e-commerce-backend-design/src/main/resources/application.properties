# Application Details
spring.application.name=e-commerce-backend-design

server.port=${PORT:8080}

# Database Connection Configuration (No local fallbacks)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL Settings for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configurations
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration.ms=86400000

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173, http://localhost:3000}