spring.application.name=e-commerce-backend-design

# Database Connection Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:topik712}

# Hibernate DDL Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

